🧬 2) API CATAR — Version OpenAPI 3.1 (standard industriel)
(compatible Swagger, Postman, Redoc, Insomnia)

Voici la spécification complète :

yaml
openapi: 3.1.0
info:
  title: CATAR Subnet API
  version: 1.0.0
  description: API officielle du Subnet CATAR pour la génération, le scoring et l'analyse.

paths:

  /catar/generate:
    post:
      summary: Génère une réponse à partir d'un prompt CATAR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string }
                prompt: { type: string }
                model: { type: string }
                metadata:
                  type: object
      responses:
        "200":
          description: Réponse générée
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid: { type: string }
                  task_id: { type: string }
                  prompt: { type: string }
                  response: { type: string }
                  model: { type: string }
                  timestamp: { type: string }

  /catar/score:
    post:
      summary: Score une réponse selon les invariants CATAR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid: { type: string }
                task_id: { type: string }
                response: { type: string }
      responses:
        "200":
          description: Score CATAR
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid: { type: string }
                  task_id: { type: string }
                  global_score: { type: number }
                  markers_detected:
                    type: array
                    items: { type: string }
                  details:
                    type: object
                  validator_version: { type: string }

  /catar/stats:
    get:
      summary: Renvoie les statistiques agrégées du dataset CATAR.
      responses:
        "200":
          description: Statistiques globales
          content:
            application/json:
              schema:
                type: object
                properties:
                  global_mean: { type: number }
                  global_std: { type: number }
                  per_invariant:
                    type: object

  /catar/prompt/{task_id}/{level}/{variation}:
    get:
      summary: Récupère un prompt CATAR spécifique.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
        - name: level
          in: path
          required: true
          schema: { type: string }
        - name: variation
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Prompt CATAR
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  level: { type: string }
                  variation: { type: integer }
                  prompt: { type: string }
